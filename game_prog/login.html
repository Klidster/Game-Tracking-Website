<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Login | GameProg</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
    rel="stylesheet"
  >

</head>


<body class="auth-page">


  <main class="auth-container">


    <div class="auth-card">


      <a
        href="index.html"
        class="auth-logo"
      >
        GameProg
      </a>


      <h1>
        Welcome
      </h1>


      <p class="auth-description">
        Sign in to manage your personal game library.
      </p>


      <div class="auth-tabs">

        <button
          class="auth-tab active"
          id="login-tab"
        >
          Login
        </button>

        <button
          class="auth-tab"
          id="signup-tab"
        >
          Sign Up
        </button>

      </div>


      <form id="auth-form">


        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email..."
            required
          />

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password..."
            required
          />

        </div>


        <p
          class="auth-message"
          id="auth-message"
        ></p>


        <button
          type="submit"
          class="full-button"
          id="auth-submit"
        >
          Login
        </button>


      </form>


    </div>


  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>

  <script src="auth.js"></script>


</body>

</html>
